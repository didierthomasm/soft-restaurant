name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabernas
          POSTGRES_PASSWORD: tabernas
          POSTGRES_DB: tabernas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tabernas -d tabernas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SR_MODE: fake
      TEST_DATABASE_URL: postgresql+psycopg://tabernas:tabernas@localhost:5432/tabernas_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run coverage report --include="*/tabernas/domain/*" --fail-under=95

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      SR_MODE: fake
      FAKE_AUTH_USER: demo
      FAKE_AUTH_PASSWORD: demo
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm backend python /scripts/seed_demo.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report
            compose.log
      - if: always()
        run: docker compose down -v
