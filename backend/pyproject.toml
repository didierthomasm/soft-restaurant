[project]
name = "tabernas"
version = "0.1.0"
description = "Attendance and sales reports on top of a SoftRestaurant POS database"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymssql>=2.4.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabernas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not sr' --strict-markers"
markers = ["sr: needs the live SoftRestaurant server (local only, never in CI)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["tabernas"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
