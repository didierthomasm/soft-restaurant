services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tabernas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabernas}
      POSTGRES_DB: tabernas
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabernas -d tabernas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false  # CI and the public demo run without a .env
    environment:
      SR_MODE: ${SR_MODE:-fake}  # safe default for a fresh clone without .env; the real machine's .env sets SR_MODE=live
      DATABASE_URL: postgresql+psycopg://tabernas:${POSTGRES_PASSWORD:-tabernas}@db:5432/tabernas
      FREETDSCONF: /etc/freetds/freetds.conf
    volumes:
      - ./freetds.conf:/etc/freetds/freetds.conf:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    environment:
      FAKE_AUTH_USER: ${FAKE_AUTH_USER:-demo}
      FAKE_AUTH_PASSWORD: ${FAKE_AUTH_PASSWORD:-demo}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
