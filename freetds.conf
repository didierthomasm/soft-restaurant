# FreeTDS config for pymssql.
# The SoftRestaurant server is SQL Server 2014 SP1 (12.0.4100), which only
# speaks TLS 1.0 for the login handshake. Modern OpenSSL rejects it unless
# TLS 1.0 is enabled and the security level lowered. Traffic already travels
# inside the Tailscale (WireGuard) tunnel.
[global]
    enable tls v1 = yes
    openssl ciphers = DEFAULT:@SECLEVEL=0
